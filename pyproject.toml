[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movies-we-missed"
version = "1.0.0"
description = "A movie club and interest-based social network."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mwm-server = "mwm.__main__:main"
mwm-import = "mwm.importer:main"
mwm-backup = "mwm.backup:main"
mwm-enrich = "mwm.enrichment:main"

[tool.setuptools]
packages = ["mwm"]
include-package-data = true

[tool.setuptools.package-data]
mwm = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
